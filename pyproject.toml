[project]
name = "omilia-natural-numbers-interpretation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bandit[toml]>=1.9.4",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "streamlit>=1.66.1",
]

[tool.uv]
package = false

[tool.bandit]
skips = ["B101"]
exclude_dirs = ["tests", ".venv"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]
